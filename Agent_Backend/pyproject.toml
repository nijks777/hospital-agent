[project]
name = "hospital-agent"
version = "0.1.0"
description = "AI call agent for hospitals, pluggable into third-party apps"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.7",
    "langchain-postgres>=0.0.18",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langsmith>=0.14.4",
    "pgvector>=0.3.6",
    "psycopg[binary,pool]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.0.14,<2.1",
    "sqlmodel>=0.0.47",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # autogenerated

[tool.pyright]
venvPath = "."
venv = ".venv"
